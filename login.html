<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zayna Creation — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #e89ab5;
  --rose-deep: #bd4158;
  --rose-light: #fff0f5;
  --rose-btn: #df8192;
  --bg: #fdf6f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(135deg, #fdf6f0 0%, #fce4ec 50%, #ffd6e7 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}

/* Floating flowers */
.flowers span {
  position: fixed; font-size: 22px;
  animation: fall linear infinite; opacity: 0.5; pointer-events: none;
}
.flowers span:nth-child(1){ left:5%;  animation-duration:9s;  animation-delay:0s; }
.flowers span:nth-child(2){ left:15%; animation-duration:13s; animation-delay:2s; }
.flowers span:nth-child(3){ left:30%; animation-duration:10s; animation-delay:5s; }
.flowers span:nth-child(4){ left:50%; animation-duration:8s;  animation-delay:1s; }
.flowers span:nth-child(5){ left:65%; animation-duration:12s; animation-delay:3s; }
.flowers span:nth-child(6){ left:80%; animation-duration:11s; animation-delay:7s; }
.flowers span:nth-child(7){ left:92%; animation-duration:9s;  animation-delay:4s; }
@keyframes fall {
  0%   { top: -8%;  transform: rotate(0deg) scale(1); }
  100% { top: 108%; transform: rotate(360deg) scale(0.8); }
}

/* Card wrapper */
.card-wrap {
  width: 100%; max-width: 460px;
  padding: 20px;
  z-index: 10;
  animation: slideUp 0.8s ease-out;
}
@keyframes slideUp {
  from { opacity:0; transform: translateY(40px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Glass card */
.card {
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(189,65,88,0.15), 0 4px 20px rgba(0,0,0,0.05);
  border: 1px solid rgba(255,255,255,0.9);
  overflow: hidden;
}

/* Header */
.card-header {
  background: linear-gradient(135deg, #fce4ec, #ffd6e7);
  padding: 32px 36px 24px;
  text-align: center;
  position: relative;
}
.logo {
  font-family: 'Pacifico', cursive;
  font-size: 30px; color: var(--rose-deep);
  margin-bottom: 6px;
}
.tagline { font-size: 13px; color: #8a5060; letter-spacing: 0.5px; }

/* Tab switcher */
.tabs {
  display: flex;
  border-bottom: 1px solid rgba(232,154,181,0.2);
}
.tab {
  flex: 1; padding: 14px 10px;
  text-align: center; font-size: 14px; font-weight: 600;
  color: #999; cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: 0.3s; background: none; border-top: none; border-left: none; border-right: none;
  font-family: 'DM Sans', sans-serif;
}
.tab.active { color: var(--rose-deep); border-bottom-color: var(--rose-deep); }
.tab:hover:not(.active) { color: var(--rose); }

/* Form body */
.card-body { padding: 28px 36px 32px; }

.form-panel { display: none; }
.form-panel.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

/* Alert */
.alert {
  padding: 10px 14px; border-radius: 10px;
  font-size: 13px; margin-bottom: 16px;
  display: none;
}
.alert.error   { background: #fff0f0; color: #c0392b; border: 1px solid #fcc; }
.alert.success { background: #f0fff4; color: #1a7a40; border: 1px solid #9fe3bc; }
.alert.show { display: block; }

/* Inputs */
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 12px; font-weight: 600;
  color: #8a5060; text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 12px 16px;
  border: 1.5px solid rgba(232,154,181,0.4);
  border-radius: 12px; font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  background: rgba(255,255,255,0.7);
  color: #333; transition: 0.2s; outline: none;
}
.field input:focus {
  border-color: var(--rose); background: white;
  box-shadow: 0 0 0 3px rgba(232,154,181,0.15);
}

/* Buttons */
.btn-main {
  width: 100%; padding: 14px;
  background: var(--rose-deep); color: white;
  border: none; border-radius: 50px;
  font-size: 15px; font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: 0.3s;
  box-shadow: 0 6px 20px rgba(189,65,88,0.3);
  margin-top: 4px;
}
.btn-main:hover { background: #a03348; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(189,65,88,0.4); }
.btn-main:active { transform: translateY(0); }

.btn-visitor {
  width: 100%; padding: 13px;
  background: rgba(255,255,255,0.8);
  color: #5a3040; border: 1.5px solid rgba(232,154,181,0.5);
  border-radius: 50px; font-size: 14px; font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: 0.3s;
  margin-top: 10px; text-decoration: none;
  display: block; text-align: center;
}
.btn-visitor:hover { background: rgba(255,255,255,1); border-color: var(--rose); color: var(--rose-deep); }

.divider {
  text-align: center; font-size: 12px; color: #bbb;
  margin: 18px 0; position: relative;
}
.divider::before, .divider::after {
  content: ''; position: absolute; top: 50%;
  width: 38%; height: 1px; background: rgba(232,154,181,0.25);
}
.divider::before { left: 0; }
.divider::after  { right: 0; }

.footer-note {
  text-align: center; font-size: 12px; color: #aaa;
  margin-top: 20px;
}
.footer-note a { color: var(--rose); text-decoration: none; }
.footer-note a:hover { text-decoration: underline; }

/* Loading spinner */
.loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="flowers">
  <span>🌸</span><span>🌷</span><span>🌺</span><span>🌸</span>
  <span>🌷</span><span>🌺</span><span>🌸</span>
</div>

<div class="card-wrap">
  <div class="card">

    <div class="card-header">
      <div class="logo">Zayna Creation</div>
      <div class="tagline">✨ Handmade with love — Enter your world</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <div class="card-body">

      <!-- ── LOGIN PANEL ── -->
      <div class="form-panel active" id="panel-login">
        <div class="alert error" id="login-error"></div>
        <div class="alert success" id="login-success"></div>

        <form id="loginForm">
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-main">Sign In 💕</button>
        </form>

        <div class="divider">or</div>
        <a href="index.html" class="btn-visitor">👁️ Continue as a guest</a>

        <div class="footer-note">
          No account yet? <a href="#" onclick="switchTab('register')">Create Account</a>
        </div>
      </div>

      <!-- ── REGISTER PANEL ── -->
      <div class="form-panel" id="panel-register">
        <div class="alert error" id="register-error"></div>
        <div class="alert success" id="register-success"></div>

        <form id="registerForm">
          <div class="field">
            <label>Full Name</label>
            <input type="text" name="full_name" placeholder="Your name" required>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="field">
            <label>Phone</label>
            <input type="tel" name="phone" placeholder="+216 xx xxx xxx">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-main">Create My Account 🌸</button>
        </form>

        <div class="divider">or</div>
        <a href="index.html" class="btn-visitor">👁️ Continue as a guest</a>

        <div class="footer-note">
          Already have an account? <a href="#" onclick="switchTab('login')">Sign In</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register')));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
}

function showAlert(id, message, type) {
  const el = document.getElementById(id);
  el.textContent = message;
  el.className = 'alert ' + type + ' show';
}
function hideAlerts(prefix) {
  ['error','success'].forEach(t => {
    const el = document.getElementById(prefix+'-'+t);
    if(el) el.classList.remove('show');
  });
}

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideAlerts('login');
  const btn = this.querySelector('button[type=submit]');
  btn.innerHTML = '<span class="loading"></span>Signing in...';
  btn.disabled = true;

  const data = new FormData(this);
  try {
    const res  = await fetch('auth.php?action=login', { method:'POST', body: data });
    const json = await res.json();
    if(json.success) {
      showAlert('login-success', '✅ Welcome! Redirecting...', 'success');
      setTimeout(() => { window.location.href = json.redirect || 'index.html'; }, 1000);
    } else {
      showAlert('login-error', '❌ ' + json.error, 'error');
    }
  } catch(err) {
    showAlert('login-error', '❌ Cannot reach the server.', 'error');
  }
  btn.innerHTML = 'Sign In 💕'; btn.disabled = false;
});

// REGISTER
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideAlerts('register');

  const pwd  = this.querySelector('[name=password]').value;
  const cpwd = this.querySelector('[name=confirm_password]').value;
  if(pwd !== cpwd) { showAlert('register-error','❌ Passwords do not match.','error'); return; }

  const btn = this.querySelector('button[type=submit]');
  btn.innerHTML = '<span class="loading"></span>Creating...';
  btn.disabled = true;

  const data = new FormData(this);
  try {
    const res  = await fetch('auth.php?action=register', { method:'POST', body: data });
    const json = await res.json();
    if(json.success) {
      showAlert('register-success', '🎉 Account created! Signing you in...', 'success');
      setTimeout(() => { window.location.href = json.redirect || 'index.html'; }, 1500);
    } else {
      showAlert('register-error', '❌ ' + json.error, 'error');
    }
  } catch(err) {
    showAlert('register-error', '❌ Cannot reach the server.', 'error');
  }
  btn.innerHTML = 'Create My Account 🌸'; btn.disabled = false;
});
</script>
</body>
</html>
